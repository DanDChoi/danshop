spring:
  application:
    name: danshop
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 100
    database: postgresql
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:danshop}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:danuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:dan}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
jwt:
  secret: danshop-secret-key-must-be-at-least-32-characters
  access-expiration: 1800000
  refresh-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


